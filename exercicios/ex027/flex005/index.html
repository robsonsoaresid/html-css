<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox centralizado</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(211, 113, 113);
            display: flex;
           
        }

        main {
            background-color: rgb(47, 102, 47);
            width: 80vw;
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        section {
            background-color: rgb(76, 76, 126);
            width: 200px;
            height: 200px;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Tela de login</h1>
        </section>
    </main>
    
</body>
</html>
