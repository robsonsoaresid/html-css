<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exempço de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="iano">Em que você nasceu?</label>
            <input type="number" name="ano" id="iano" min="1990" max="2020" oninput="CalcIdade()">
        </p>

        <p>
            <label for="iidade">Sua idade é:</label>
            <output id="iidade">0</output>
        </p>

        <input type="submit" value="enviar">
        <input type="reset" value="limpar">
    </form>
     <p>
            <script>
                function CalcIdade() {
                    let atual = new Date().getFullYear() 
                    iidade.innerHTML = Number(atual) - Number(iano.value)
                }
            </script>
        </p>
</body>
</html>
