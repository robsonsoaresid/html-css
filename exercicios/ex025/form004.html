<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de email e número de telefone</h1>
    <form action="cadastro.php  " method="get" autocomplete="on">
         <fieldset>
            <legend>Dados pessoais</legend>
        <p>
            <label for="inome">Nome</label>
            <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required placeholder="Nome">
        </p>
        <p>
            <label for="iemail">E-mail</label>
            <input type="email" name="email" id="iemail" autocomplete="email" required placeholder="E-mail">
        </p>
        <p>
            <label for="itl">telefone</label>
            <input type="tel" name="tel" id="itel" autocomplete="tel" pattern="^\(\d{2}\)\d{4,5}-\d{4}$" required placeholder="(xx)xxxx-xxxx">
        </p>
        <!--estudar mais sobre regEx espressões regulares-->
        <p>
            <input type="submit" value="volta">
            <input type="reset" value="limpar">
        </p>
        </fieldset>

    </form>
    
</body>
</html>
