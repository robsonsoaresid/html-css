<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de checkbox e radio</h1>
    <form action="cdastrp.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="Sexo" id="isxmas" value="M"><label for="isxmas">Masculino</label><br>
            <input type="radio" name="Sexo" id="isxfem" value="F" checked><label for="isxfem">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="esbas" id="iesbas"><label for="iesbas"> Basquete</label><br>
            <input type="checkbox" name="esfut" id="iesfut" checked><label for="iesfut"> Futbebol</label><br>
            <input type="checkbox" name="esnat" id="iesnat"> <label for="iesnat">Natação</label><br>
            <input type="checkbox" name="esten" id="iesten"> <label for="iesten">Tênes</label><br>
        </fieldset>

        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="linpar">
        </p>

    </form>
    
</body>
</html>
